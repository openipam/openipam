[project]
name = "openipam-dhcpd"
version = "0.1.0"
description = "OpenIPAM DHCP server"
requires-python = ">=3.12"
dependencies = [
    "cherrypy==3.2.6",
    "sqlalchemy==2.0.45",
    "psycopg2-binary>=2.9.9",
    "python-ldap==3.1.0",
    "pyopenssl==19.1.0",
    "ipy==1.01",
    "cheetah3>=3.2.7b1",
    "pydhcplib",
    "ipython>=8.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pydhcplib = { path = "pydhcplib", editable = true }
